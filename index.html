<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxd.io Mod Loader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg1: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --border: #30363d;
            --text1: #e6edf3;
            --text2: #8b949e;
            --green: #3fb950;
            --blue: #58a6ff;
            --red: #f85149;
            --yellow: #d29922;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg1);
            color: var(--text1);
            min-height: 100vh;
        }

        .header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text { font-size: 18px; font-weight: 600; }

        .version {
            background: var(--blue);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text1);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background: var(--border); }

        .btn-primary {
            background: var(--green);
            border-color: var(--green);
            color: #000;
        }

        .btn-primary:hover { background: #2ea043; }

        .main {
            display: flex;
            height: calc(100vh - 60px);
        }

        .sidebar {
            width: 280px;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
        }

        .mod-count {
            background: var(--bg3);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
        }

        .mod-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .mod-item {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mod-item:hover { border-color: var(--blue); }

        .mod-item.selected {
            border-color: var(--blue);
            background: rgba(88, 166, 255, 0.1);
        }

        .mod-item.disabled { opacity: 0.5; }

        .mod-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .mod-name {
            font-weight: 500;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mod-status {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }

        .mod-status.on { background: rgba(63, 185, 80, 0.2); color: var(--green); }
        .mod-status.off { background: rgba(139, 148, 158, 0.2); color: var(--text2); }

        .mod-preview {
            font-family: monospace;
            font-size: 10px;
            color: var(--text2);
            background: var(--bg1);
            padding: 4px 6px;
            border-radius: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 6px;
        }

        .mod-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .toggle {
            position: relative;
            width: 32px;
            height: 18px;
        }

        .toggle input { opacity: 0; width: 0; height: 0; }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--bg1);
            border-radius: 18px;
            transition: 0.3s;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background: var(--text2);
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle input:checked + .toggle-slider { background: var(--green); }
        .toggle input:checked + .toggle-slider:before { transform: translateX(14px); background: white; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text2);
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 11px;
        }

        .action-btn:hover { background: var(--border); color: var(--text1); }
        .action-btn.delete:hover { color: var(--red); }

        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: var(--text2);
        }

        .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

        .sidebar-footer {
            padding: 10px;
            border-top: 1px solid var(--border);
        }

        .sidebar-footer .btn { width: 100%; justify-content: center; }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-split {
            flex: 1;
            display: flex;
            gap: 1px;
            background: var(--border);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg1);
        }

        .panel-header {
            background: var(--bg2);
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .panel-info { font-size: 11px; color: var(--text2); }

        .code-editor {
            flex: 1;
            padding: 14px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
            background: var(--bg1);
            color: var(--text1);
            border: none;
            outline: none;
            resize: none;
        }

        .code-output {
            flex: 1;
            padding: 14px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
            background: var(--bg1);
            color: var(--text1);
            overflow: auto;
            white-space: pre;
        }

        .placeholder { color: var(--text2); font-style: italic; }

        .char-bar {
            font-size: 11px;
            color: var(--text2);
            padding: 6px 14px;
            background: var(--bg2);
            border-top: 1px solid var(--border);
        }

        .char-bar.warning { color: var(--yellow); }
        .char-bar.error { color: var(--red); }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-bg.show { display: flex; }

        .modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            width: 350px;
            max-width: 90%;
        }

        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; }

        .modal-input {
            width: 100%;
            padding: 10px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text1);
            font-size: 13px;
            margin-bottom: 14px;
        }

        .modal-input:focus { outline: none; border-color: var(--blue); }

        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }

        .toast-box { position: fixed; top: 15px; right: 15px; z-index: 2000; }

        .toast {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        .toast.ok { border-color: var(--green); }
        .toast.err { border-color: var(--red); }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 800px) {
            .main { flex-direction: column; }
            .sidebar { width: 100%; max-height: 220px; }
            .editor-split { flex-direction: column; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg1); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span style="font-size: 20px;">⚡</span>
            <span class="logo-text">Bloxd.io Mod Loader</span>
            <span class="version">v1.1</span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn" onclick="exportMods()">📁 Export</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">📥 Import</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importMods(event)">
            <button class="btn btn-primary" onclick="copyOutput()">📋 Copy Output</button>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Mods</span>
                <span class="mod-count" id="modCount">0 mods</span>
            </div>
            <div class="mod-list" id="modList"></div>
            <div class="sidebar-footer">
                <button class="btn btn-primary" onclick="openModal('add')">➕ Add New Mod</button>
            </div>
        </aside>

        <div class="editor-area">
            <div class="editor-split">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">📝 <span id="inputTitle">Mod Code Input</span></span>
                        <span class="panel-info" id="inputInfo">Select a mod</span>
                    </div>
                    <textarea class="code-editor" id="inputCode" placeholder="// Select a mod to edit

// Example:
tick = () => {
    // runs every tick
};

onPlayerJoin = pid => {
    api.sendMessage(pid, 'Welcome!');
};" spellcheck="false"></textarea>
                    <div class="char-bar" id="inputChars">0 chars</div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">📄 Combined Output</span>
                        <span class="panel-info">Copy to Bloxd.io World Code</span>
                    </div>
                    <div class="code-output" id="outputCode">
                        <span class="placeholder">// Enable mods to see combined output here

// Output will be CLEAN code only - no comments added.
// Just raw mod code concatenated together.</span>
                    </div>
                    <div class="char-bar" id="outputChars">0 / 16,000</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-bg" id="modalBg">
        <div class="modal">
            <h3 class="modal-title" id="modalTitle">Add New Mod</h3>
            <input type="text" class="modal-input" id="modalInput" placeholder="Mod name..." maxlength="50">
            <div class="modal-btns">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveModal()">Save</button>
            </div>
        </div>
    </div>

    <div class="toast-box" id="toastBox"></div>

    <script>
        let mods = [];
        let selectedId = null;
        let modalMode = 'add';
        let editId = null;

        function load() {
            try {
                const data = localStorage.getItem('bloxd_mods_v2');
                if (data) mods = JSON.parse(data);
            } catch(e) {}
        }

        function save() {
            localStorage.setItem('bloxd_mods_v2', JSON.stringify(mods));
        }

        function genId() {
            return 'm' + Date.now() + Math.random().toString(36).substr(2, 6);
        }

        function addMod(name) {
            const mod = {
                id: genId(),
                name: name.trim() || 'New Mod',
                code: '',
                on: true
            };
            mods.push(mod);
            save();
            selectMod(mod.id);
            render();
            toast('Added: ' + mod.name, 'ok');
        }

        function delMod(id) {
            const mod = mods.find(m => m.id === id);
            if (!mod) return;
            mods = mods.filter(m => m.id !== id);
            if (selectedId === id) {
                selectedId = null;
                document.getElementById('inputCode').value = '';
                document.getElementById('inputTitle').textContent = 'Mod Code Input';
            }
            save();
            render();
            toast('Deleted: ' + mod.name, 'ok');
        }

        function renameMod(id, name) {
            const mod = mods.find(m => m.id === id);
            if (!mod) return;
            mod.name = name.trim() || 'Unnamed';
            save();
            render();
            if (selectedId === id) {
                document.getElementById('inputTitle').textContent = 'Editing: ' + mod.name;
            }
            toast('Renamed to: ' + mod.name, 'ok');
        }

        function toggleMod(id) {
            const mod = mods.find(m => m.id === id);
            if (!mod) return;
            mod.on = !mod.on;
            save();
            render();
        }

        function selectMod(id) {
            selectedId = id;
            const mod = mods.find(m => m.id === id);
            if (mod) {
                document.getElementById('inputCode').value = mod.code;
                document.getElementById('inputTitle').textContent = 'Editing: ' + mod.name;
                document.getElementById('inputInfo').textContent = mod.on ? 'Enabled' : 'Disabled';
                updateInputChars();
            }
            render();
        }

        function updateCode(code) {
            const mod = mods.find(m => m.id === selectedId);
            if (mod) {
                mod.code = code;
                save();
                renderOutput();
            }
        }

        function render() {
            const list = document.getElementById('modList');
            const count = document.getElementById('modCount');
            
            count.textContent = mods.length + ' mod' + (mods.length !== 1 ? 's' : '');

            if (mods.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>No mods yet</p><p style="font-size:11px;margin-top:6px">Click "Add New Mod" to start</p></div>';
                renderOutput();
                return;
            }

            list.innerHTML = mods.map(m => `
                <div class="mod-item ${m.id === selectedId ? 'selected' : ''} ${!m.on ? 'disabled' : ''}" onclick="selectMod('${m.id}')">
                    <div class="mod-header">
                        <div class="mod-name">
                            <span>${m.on ? '🟢' : '🔴'}</span>
                            <span>${esc(m.name)}</span>
                        </div>
                        <span class="mod-status ${m.on ? 'on' : 'off'}">${m.on ? 'ON' : 'OFF'}</span>
                    </div>
                    <div class="mod-preview">${esc(m.code.substring(0, 40))}${m.code.length > 40 ? '...' : ''}</div>
                    <div class="mod-actions">
                        <label class="toggle">
                            <input type="checkbox" ${m.on ? 'checked' : ''} onclick="event.stopPropagation(); toggleMod('${m.id}')">
                            <span class="toggle-slider"></span>
                        </label>
                        <button class="action-btn" onclick="event.stopPropagation(); openModal('rename', '${m.id}')" title="Rename">✏️</button>
                        <button class="action-btn delete" onclick="event.stopPropagation(); delMod('${m.id}')" title="Delete">🗑️</button>
                    </div>
                </div>
            `).join('');

            renderOutput();
        }

        function stripComments(code) {
            let result = code;
            result = result.replace(/\/\*[\s\S]*?\*\//g, '');
            result = result.replace(/\/\/.*$/gm, '');
            result = result.replace(/\n\s*\n\s*\n/g, '\n\n');
            result = result.trim();
            return result;
        }

        function renderOutput() {
            const out = document.getElementById('outputCode');
            const bar = document.getElementById('outputChars');
            
            const active = mods.filter(m => m.on && m.code.trim());
            
            if (active.length === 0) {
                out.innerHTML = '<span class="placeholder">// Enable mods to see combined output here\n\n// Output will be CLEAN code only - no comments added.\n// Just raw mod code concatenated together.</span>';
                bar.textContent = '0 / 16,000';
                bar.className = 'char-bar';
                return;
            }

            let result = '';
            
            active.forEach((m, i) => {
                let cleanCode = stripComments(m.code);
                if (cleanCode.trim()) {
                    result += cleanCode;
                    if (!cleanCode.endsWith('\n')) result += '\n';
                    result += '\n';
                }
            });

            out.textContent = result;
            
            const len = result.length;
            bar.textContent = len.toLocaleString() + ' / 16,000 chars';
            
            if (len > 16000) {
                bar.className = 'char-bar error';
            } else if (len > 12000) {
                bar.className = 'char-bar warning';
            } else {
                bar.className = 'char-bar';
            }
        }

        function updateInputChars() {
            const code = document.getElementById('inputCode').value;
            document.getElementById('inputChars').textContent = code.length.toLocaleString() + ' chars';
        }

        function openModal(mode, id) {
            modalMode = mode;
            editId = id || null;
            
            const title = document.getElementById('modalTitle');
            const input = document.getElementById('modalInput');
            
            if (mode === 'add') {
                title.textContent = 'Add New Mod';
                input.value = '';
            } else {
                title.textContent = 'Rename Mod';
                const mod = mods.find(m => m.id === id);
                input.value = mod ? mod.name : '';
            }
            
            document.getElementById('modalBg').classList.add('show');
            input.focus();
        }

        function closeModal() {
            document.getElementById('modalBg').classList.remove('show');
            editId = null;
        }

        function saveModal() {
            const name = document.getElementById('modalInput').value;
            if (modalMode === 'add') {
                addMod(name);
            } else if (editId) {
                renameMod(editId, name);
            }
            closeModal();
        }

        function exportMods() {
            const data = JSON.stringify(mods, null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'bloxd_mods.json';
            a.click();
            URL.revokeObjectURL(url);
            toast('Exported!', 'ok');
        }

        function importMods(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data)) {
                        mods = [...mods, ...data];
                        save();
                        render();
                        toast('Imported ' + data.length + ' mods!', 'ok');
                    }
                } catch(err) {
                    toast('Invalid file!', 'err');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function copyOutput() {
            const code = document.getElementById('outputCode').textContent;
            if (code.includes('Enable mods to see')) {
                toast('No mods to copy!', 'err');
                return;
            }
            navigator.clipboard.writeText(code).then(() => {
                toast('Copied!', 'ok');
            }).catch(() => {
                toast('Copy failed!', 'err');
            });
        }

        function toast(msg, type) {
            const box = document.getElementById('toastBox');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.innerHTML = '<span>' + (type === 'ok' ? '✅' : '❌') + '</span><span>' + esc(msg) + '</span>';
            box.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                setTimeout(() => t.remove(), 300);
            }, 2000);
        }

        function esc(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        document.getElementById('inputCode').addEventListener('input', function() {
            updateCode(this.value);
            updateInputChars();
        });

        document.getElementById('modalInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveModal();
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('modalBg').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        load();
        render();
        if (mods.length > 0) selectMod(mods[0].id);
    </script>
</body>
</html>
