<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxd.io Mod Loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-green: #3fb950;
            --accent-blue: #58a6ff;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
        }

        .version {
            background: var(--accent-blue);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--border-color);
        }

        .btn-primary {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #000;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .main {
            display: flex;
            height: calc(100vh - 70px);
        }

        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .mod-count {
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .mod-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .mod-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mod-item:hover {
            border-color: var(--accent-blue);
        }

        .mod-item.selected {
            border-color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.1);
        }

        .mod-item.disabled {
            opacity: 0.5;
        }

        .mod-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .mod-name {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mod-status {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .mod-status.on {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-green);
        }

        .mod-status.off {
            background: rgba(139, 148, 158, 0.2);
            color: var(--text-secondary);
        }

        .mod-preview {
            font-family: monospace;
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--bg-primary);
            padding: 6px 8px;
            border-radius: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 8px;
        }

        .mod-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--bg-primary);
            border-radius: 20px;
            transition: 0.3s;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle input:checked + .toggle-slider {
            background: var(--accent-green);
        }

        .toggle input:checked + .toggle-slider:before {
            transform: translateX(16px);
            background: white;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .action-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .action-btn.delete:hover {
            color: var(--accent-red);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
        }

        .sidebar-footer .btn {
            width: 100%;
            justify-content: center;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-split {
            flex: 1;
            display: flex;
            gap: 1px;
            background: var(--border-color);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .panel-header {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-info {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .code-editor {
            flex: 1;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: none;
            outline: none;
            resize: none;
        }

        .code-output {
            flex: 1;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: auto;
            white-space: pre;
        }

        .placeholder {
            color: var(--text-secondary);
            font-style: italic;
        }

        .char-bar {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .char-bar.warning {
            color: var(--accent-yellow);
        }

        .char-bar.error {
            color: var(--accent-red);
        }

        /* Modal */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-bg.show {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            max-width: 90%;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .modal-btns {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Toast */
        .toast-box {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .toast.ok {
            border-color: var(--accent-green);
        }

        .toast.err {
            border-color: var(--accent-red);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 800px) {
            .main {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 250px;
            }
            .editor-split {
                flex-direction: column;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span style="font-size: 24px;">⚡</span>
            <span class="logo-text">Bloxd.io Mod Loader</span>
            <span class="version">v1.0</span>
        </div>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <button class="btn" onclick="exportMods()">📁 Export</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">📥 Import</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importMods(event)">
            <button class="btn btn-primary" onclick="copyOutput()">📋 Copy Output</button>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Mods</span>
                <span class="mod-count" id="modCount">0 mods</span>
            </div>
            <div class="mod-list" id="modList"></div>
            <div class="sidebar-footer">
                <button class="btn btn-primary" onclick="openModal('add')">➕ Add New Mod</button>
            </div>
        </aside>

        <div class="editor-area">
            <div class="editor-split">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">📝 <span id="inputTitle">Mod Code Input</span></span>
                        <span class="panel-info" id="inputInfo">Select a mod</span>
                    </div>
                    <textarea class="code-editor" id="inputCode" placeholder="// Select a mod to edit its code

// Example:
function tick() {
    // runs every tick
}

function onPlayerJoin(pid) {
    api.sendMessage(pid, 'Welcome!');
}" spellcheck="false"></textarea>
                    <div class="char-bar" id="inputChars">0 chars</div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">📄 Combined Output</span>
                        <span class="panel-info">Copy to Bloxd.io World Code</span>
                    </div>
                    <div class="code-output" id="outputCode">
                        <span class="placeholder">// Enable mods to see combined output here</span>
                    </div>
                    <div class="char-bar" id="outputChars">0 / 16,000</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-bg" id="modalBg">
        <div class="modal">
            <h3 class="modal-title" id="modalTitle">Add New Mod</h3>
            <input type="text" class="modal-input" id="modalInput" placeholder="Mod name..." maxlength="50">
            <div class="modal-btns">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveModal()">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-box" id="toastBox"></div>

    <script>
        // ============ STATE ============
        let mods = [];
        let selectedId = null;
        let modalMode = 'add';
        let editId = null;

        function load() {
            try {
                const data = localStorage.getItem('bloxd_mods');
                if (data) mods = JSON.parse(data);
            } catch(e) {}
        }

        function save() {
            localStorage.setItem('bloxd_mods', JSON.stringify(mods));
        }

        function genId() {
            return 'm' + Date.now() + Math.random().toString(36).substr(2, 6);
        }

        // ============ MOD OPERATIONS ============
        function addMod(name) {
            const mod = {
                id: genId(),
                name: name.trim() || 'New Mod',
                code: '',
                on: true
            };
            mods.push(mod);
            save();
            selectMod(mod.id);
            render();
            toast('Added: ' + mod.name, 'ok');
        }

        function delMod(id) {
            const mod = mods.find(m => m.id === id);
            if (!mod) return;
            mods = mods.filter(m => m.id !== id);
            if (selectedId === id) {
                selectedId = null;
                document.getElementById('inputCode').value = '';
                document.getElementById('inputTitle').textContent = 'Mod Code Input';
            }
            save();
            render();
            toast('Deleted: ' + mod.name, 'ok');
        }

        function renameMod(id, name) {
            const mod = mods.find(m => m.id === id);
            if (!mod) return;
            mod.name = name.trim() || 'Unnamed';
            save();
            render();
            if (selectedId === id) {
                document.getElementById('inputTitle').textContent = 'Editing: ' + mod.name;
            }
            toast('Renamed to: ' + mod.name, 'ok');
        }

        function toggleMod(id) {
            const mod = mods.find(m => m.id === id);
            if (!mod) return;
            mod.on = !mod.on;
            save();
            render();
        }

        function selectMod(id) {
            selectedId = id;
            const mod = mods.find(m => m.id === id);
            if (mod) {
                document.getElementById('inputCode').value = mod.code;
                document.getElementById('inputTitle').textContent = 'Editing: ' + mod.name;
                document.getElementById('inputInfo').textContent = mod.on ? 'Enabled' : 'Disabled';
                updateInputChars();
            }
            render();
        }

        function updateCode(code) {
            const mod = mods.find(m => m.id === selectedId);
            if (mod) {
                mod.code = code;
                save();
                renderOutput();
            }
        }

        // ============ RENDER ============
        function render() {
            const list = document.getElementById('modList');
            const count = document.getElementById('modCount');
            
            count.textContent = mods.length + ' mod' + (mods.length !== 1 ? 's' : '');

            if (mods.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>No mods yet</p><p style="font-size:12px;margin-top:8px">Click "Add New Mod" to start</p></div>';
                renderOutput();
                return;
            }

            list.innerHTML = mods.map(m => `
                <div class="mod-item ${m.id === selectedId ? 'selected' : ''} ${!m.on ? 'disabled' : ''}" onclick="selectMod('${m.id}')">
                    <div class="mod-header">
                        <div class="mod-name">
                            <span>${m.on ? '🟢' : '🔴'}</span>
                            <span>${esc(m.name)}</span>
                        </div>
                        <span class="mod-status ${m.on ? 'on' : 'off'}">${m.on ? 'ON' : 'OFF'}</span>
                    </div>
                    <div class="mod-preview">${esc(m.code.substring(0, 50))}${m.code.length > 50 ? '...' : ''}</div>
                    <div class="mod-actions">
                        <label class="toggle">
                            <input type="checkbox" ${m.on ? 'checked' : ''} onclick="event.stopPropagation(); toggleMod('${m.id}')">
                            <span class="toggle-slider"></span>
                        </label>
                        <button class="action-btn" onclick="event.stopPropagation(); openModal('rename', '${m.id}')" title="Rename">✏️</button>
                        <button class="action-btn delete" onclick="event.stopPropagation(); delMod('${m.id}')" title="Delete">🗑️</button>
                    </div>
                </div>
            `).join('');

            renderOutput();
        }

        function renderOutput() {
            const out = document.getElementById('outputCode');
            const bar = document.getElementById('outputChars');
            
            const active = mods.filter(m => m.on && m.code.trim());
            
            if (active.length === 0) {
                out.innerHTML = '<span class="placeholder">// No enabled mods with code</span>';
                bar.textContent = '0 / 16,000';
                bar.className = 'char-bar';
                return;
            }

            // Generate clean output (no special Unicode chars!)
            let result = '';
            
            // Simple header comment
            result += '// ======================================\n';
            result += '// BLOXD.IO MOD LOADER OUTPUT\n';
            result += '// ' + active.length + ' mod(s) enabled\n';
            result += '// ======================================\n\n';

            // Add each mod
            active.forEach((m, i) => {
                result += '// ------ MOD: ' + m.name + ' ------\n';
                result += m.code;
                if (!m.code.endsWith('\n')) result += '\n';
                result += '\n';
            });

            // Add required callbacks if not present
            result += '// ------ REQUIRED CALLBACKS ------\n';
            result += 'function tick() {}\n';
            result += 'function onPlayerJoin(pid) {}\n';
            result += 'function onPlayerLeave(pid) {}\n';
            result += 'function onChat(pid, msg) {}\n';
            result += 'function onKeyPress(pid, key) {}\n';

            out.textContent = result;
            
            const len = result.length;
            bar.textContent = len.toLocaleString() + ' / 16,000 chars';
            
            if (len > 16000) {
                bar.className = 'char-bar error';
            } else if (len > 12000) {
                bar.className = 'char-bar warning';
            } else {
                bar.className = 'char-bar';
            }
        }

        function updateInputChars() {
            const code = document.getElementById('inputCode').value;
            document.getElementById('inputChars').textContent = code.length.toLocaleString() + ' chars';
        }

        // ============ MODAL ============
        function openModal(mode, id) {
            modalMode = mode;
            editId = id || null;
            
            const title = document.getElementById('modalTitle');
            const input = document.getElementById('modalInput');
            
            if (mode === 'add') {
                title.textContent = 'Add New Mod';
                input.value = '';
            } else {
                title.textContent = 'Rename Mod';
                const mod = mods.find(m => m.id === id);
                input.value = mod ? mod.name : '';
            }
            
            document.getElementById('modalBg').classList.add('show');
            input.focus();
        }

        function closeModal() {
            document.getElementById('modalBg').classList.remove('show');
            editId = null;
        }

        function saveModal() {
            const name = document.getElementById('modalInput').value;
            if (modalMode === 'add') {
                addMod(name);
            } else if (editId) {
                renameMod(editId, name);
            }
            closeModal();
        }

        // ============ IMPORT/EXPORT ============
        function exportMods() {
            const data = JSON.stringify(mods, null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'bloxd_mods.json';
            a.click();
            URL.revokeObjectURL(url);
            toast('Exported successfully!', 'ok');
        }

        function importMods(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data)) {
                        mods = [...mods, ...data];
                        save();
                        render();
                        toast('Imported ' + data.length + ' mods!', 'ok');
                    }
                } catch(err) {
                    toast('Invalid file!', 'err');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // ============ CLIPBOARD ============
        function copyOutput() {
            const code = document.getElementById('outputCode').textContent;
            if (code.includes('No enabled mods')) {
                toast('No mods to copy!', 'err');
                return;
            }
            navigator.clipboard.writeText(code).then(() => {
                toast('Copied to clipboard!', 'ok');
            }).catch(() => {
                toast('Copy failed!', 'err');
            });
        }

        // ============ TOAST ============
        function toast(msg, type) {
            const box = document.getElementById('toastBox');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.innerHTML = '<span>' + (type === 'ok' ? '✅' : '❌') + '</span><span>' + esc(msg) + '</span>';
            box.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                setTimeout(() => t.remove(), 300);
            }, 2500);
        }

        // ============ UTILS ============
        function esc(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // ============ EVENTS ============
        document.getElementById('inputCode').addEventListener('input', function() {
            updateCode(this.value);
            updateInputChars();
        });

        document.getElementById('modalInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveModal();
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('modalBg').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============ INIT ============
        load();
        render();
        if (mods.length > 0) selectMod(mods[0].id);
    </script>
</body>
</html>
